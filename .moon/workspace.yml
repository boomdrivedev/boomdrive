# moon runs boomdrive's checks: one project per crate, holding its
# own checks, and the root, holding what spans the tree (core.7):
#   boomdrive          the binary and its library
#   boomdrive-control  the interface to the control plane, its fake and
#                     the cases every implementation passes
#   boomdrive-crew     crew's implementation of the interface
#   boomdrive-hosted   the hosted control plane's implementation, which
#                     holds the runner's protocol
# Each check is tagged with its layer, which a branch's policy requires by
# tag (.config/sluice.toml):
#   check-fast    the crate's format, lint, type check and tests; the
#                 root's format, toolchain, records, specs and changes.
#                 main requires it
# A task whose inputs are identical to a run that passed on this host, in
# any worktree, replays from .moon/cache/outputs (a link into the git common
# dir, made by devenv.nix) instead of running again.
$schema: 'https://moonrepo.dev/schemas/workspace.json'

projects:
  boomdrive: 'crates/boomdrive'
  boomdrive-control: 'crates/boomdrive-control'
  boomdrive-crew: 'crates/boomdrive-crew'
  boomdrive-hosted: 'crates/boomdrive-hosted'
  root: '.'

# --affected compares against the merge-base with main.
vcs:
  client: 'git'
  defaultBranch: 'main'

telemetry: false
