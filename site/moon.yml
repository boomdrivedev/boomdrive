$schema: 'https://moonrepo.dev/schemas/project.json'

# The site, site/ (record 0037): each check one task (core.7), run in site/
# by the tools devenv.nix pins (core.8). Each declares the shell's files
# among its inputs, so a candidate that changes none of the site's inputs
# replays its checks.
language: 'typescript'
layer: 'application'

tasks:
  # No layer: it checks nothing, and the tasks that need the packages run it
  # first. It installs bun.lock's packages with no network, from bun's cache
  # as the devenv shell fetched it outside the gate's sandbox by flume's
  # site/packages.nix at the tag flake.lock names (scripts/install.sh;
  # design Decision 4).
  install:
    command: 'sh scripts/install.sh'
    inputs: ['package.json', 'bun.lock', 'scripts/install.sh', '/flake.lock', '/nix/inputs.nix', '/devenv.nix', '/devenv.lock', '/.prototools']
    options: {cache: false}
  # Astro's type check of the pages, components and content. It and build
  # both write .astro/, so they share one mutex and never run at once.
  # Astro keeps its telemetry setting in the user's home, which the gate's
  # sandbox may refuse: with telemetry off it reads and writes nothing
  # there. Node.js is on the shell's PATH, so bun runs Astro's bin with it.
  check:
    command: 'bun run check'
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    inputs: ['src/**/*', 'astro.config.mjs', 'tsconfig.json', 'package.json', 'bun.lock', '/devenv.nix', '/devenv.lock', '/.prototools']
    deps: ['~:install']
    tags: [check-fast]
    options: {mutex: 'astro'}
