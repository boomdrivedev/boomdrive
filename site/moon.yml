$schema: 'https://moonrepo.dev/schemas/project.json'

# The site: every check `site-check` runs, as moon tasks, and the check that
# OpenSpec's Claude Code skills are the pinned OpenSpec's. The types, the
# prose, the build and the skills are the fast layer, which sluice's gate
# requires on main and on every bolt; a pass replays wherever the inputs are
# the same.
# The check and the build both write the .astro folder, so they share one
# mutex and run one after the other, never at once.
language: 'typescript'
layer: 'application'

tasks:
  install:
    command: 'bun install --frozen-lockfile'
    inputs: ['package.json', 'bun.lock', 'devenv.nix', 'devenv.lock', '.prototools']
    options: {cache: false}
  check:
    command: 'bun run check'
    inputs: ['src/**/*', 'astro.config.mjs', 'tsconfig.json', 'package.json', 'bun.lock', 'devenv.nix', 'devenv.lock', '.prototools']
    deps: ['~:install']
    tags: [check-fast]
    options: {mutex: 'astro'}
  # The glossary is the one source of the vocabulary Vale enforces.
  vocab:
    command: 'bun run scripts/vocab.ts'
    inputs: ['src/content/terms/terms.yaml', 'scripts/vocab.ts', 'package.json', 'bun.lock']
    outputs: ['styles/config/vocabularies/Boomdrive/accept.txt', 'styles/Boomdrive/Terms.yml']
    deps: ['~:install']
  prose:
    command: 'vale src/content'
    inputs: ['src/content/**/*', '.vale.ini', 'styles/**/*', 'devenv.nix', 'devenv.lock', '.prototools']
    deps: ['~:vocab']
    tags: [check-fast]
  build:
    command: 'bun run build'
    inputs: ['src/**/*', 'public/**/*', 'astro.config.mjs', 'tsconfig.json', 'package.json', 'bun.lock', 'devenv.nix', 'devenv.lock', '.prototools']
    outputs: ['dist']
    deps: ['~:install']
    tags: [check-fast]
    options: {mutex: 'astro'}
  # OpenSpec's Claude Code skills the tree tracks name the release devenv.nix
  # pins (record 0003).
  openspec-skills:
    command: 'bun run scripts/openspec-skills.ts'
    inputs: ['.claude/skills/**/*', 'scripts/openspec-skills.ts', 'devenv.nix', 'devenv.lock']
    tags: [check-fast]
