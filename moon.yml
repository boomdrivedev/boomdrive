$schema: 'https://moonrepo.dev/schemas/project.json'

# The workspace as a whole: what spans the tree, each check one task
# (core.7).
tasks:
  # Every formatter treefmt.nix configures, writing nothing it would change
  # and keeping no cache outside the tree. It reads every tracked file: one
  # that no formatter claims and no exclude names fails it (core.7). Its
  # inputs are the files the commit holds, since a key naming a file the
  # tree lacks is refused by sluice's key check (record 0054): each entry
  # of .gitignore is negated here where git matches it, at any depth where
  # the entry has no slash but a last one, and an entry added there is
  # added here, so moon hashes only what git tracks and none of cargo's
  # target/, the site's node_modules/, devenv's .devenv/, Claude Code's
  # files or moon's own cache. moon 2.6.1 has no setting for that: it walks
  # the file system for the root project's globs whatever
  # hasher.walkStrategy says, and hashes each file it finds.
  format:
    command: 'treefmt --ci'
    inputs:
      - '/**/*'
      - '!/**/.devenv/**/*'
      - '!/**/.devenv.flake.nix'
      - '!/**/devenv.local.nix'
      - '!/**/.pre-commit-config.yaml'
      - '!/.moon/cache/**/*'
      - '!/result'
      - '!/result/**/*'
      - '!/**/.DS_Store'
      - '!/target/**/*'
      - '!/.mcp.json'
      - '!/.claude/settings.json'
      - '!/.claude/settings.local.json'
      - '!/site/node_modules/**/*'
      - '!/site/dist/**/*'
      - '!/site/.astro/**/*'
      - '/devenv.nix'
      - '/devenv.lock'
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  # rustc, cargo, clippy and rustfmt are the build .prototools pins, and
  # git and OpenSpec the releases devenv.nix pins, on whichever host runs
  # the gate (core.8). It reads the tools it checks from outside the tree,
  # so it never replays.
  toolchain:
    command: 'sh check-toolchain.sh'
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true, cache: false}
  # Every spec under openspec/specs passes openspec validate --strict, which
  # fails a warning as an error, by the openspec devenv.nix pins (core.8).
  # It sends no usage statistics and asks for no newer release.
  specs:
    command: 'openspec validate --specs --strict --no-interactive'
    env: {OPENSPEC_TELEMETRY: '0', OPENSPEC_NO_UPDATE_CHECK: '1'}
    inputs: ['/openspec/specs/**/*', '/openspec/config.yaml', '/devenv.nix', '/devenv.lock']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  # Every open change under openspec/changes passes the same strict
  # validation, and archives cleanly: openspec archive applies its deltas
  # to a scratch copy of the specs, and each spec it writes passes
  # openspec validate --strict (check-changes.sh; record 0050, core.61).
  # The specs are read and rebuilt, so they are inputs too; the archived
  # changes are not.
  changes:
    command: 'sh check-changes.sh'
    inputs: ['/openspec/changes/**/*', '!/openspec/changes/archive/**/*', '/openspec/specs/**/*', '/openspec/config.yaml', '/check-changes.sh', '/devenv.nix', '/devenv.lock']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  # Every commit since the newest release tag is a Conventional Commit
  # (check-commits.sh, .versionrc), since git-cliff releases from them
  # (record 0024, core.48). It reads the history, outside any input, so it
  # never replays.
  commits:
    command: 'sh check-commits.sh'
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true, cache: false}
  # main's tree names 0.0.0: Cargo.toml's workspace version, which each
  # crate takes, Cargo.lock's entries for the crates and install.sh's
  # version= (check-versions.sh; record 0024, core.48).
  versions:
    command: 'sh check-versions.sh'
    inputs: ['/Cargo.toml', '/Cargo.lock', '/crates/*/Cargo.toml', '/install.sh', '/check-versions.sh']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  # The releases spec: release.sh and check-commits.sh in scratch
  # repositories, release-preview beside release.sh, set-version.sh and
  # check-versions.sh on scratch copies of the tree's manifests, and the
  # workflow release read (check-releases.sh).
  releases:
    command: 'sh check-releases.sh'
    inputs: ['/cliff.toml', '/.versionrc', '/release.sh', '/check-commits.sh', '/set-version.sh', '/check-versions.sh', '/check-releases.sh', '/Cargo.toml', '/Cargo.lock', '/crates/*/Cargo.toml', '/install.sh', '/.github/workflows/release.yml', '/devenv.nix', '/devenv.lock', '/flake.lock']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  # The install spec: install.sh's choices, each run on a scratch home
  # with stubs of the programs it runs, under the shell's sh and macOS's
  # /bin/sh, bash 3.2.57 (check-install.sh; core.8).
  install:
    command: 'sh check-install.sh'
    inputs: ['/install.sh', '/check-install.sh', '/devenv.nix', '/devenv.lock']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  # actionlint over the workflow release, which the root owns; the nix
  # project lints the workflow cache (nix:lint).
  workflow:
    command: 'actionlint .github/workflows/release.yml'
    inputs: ['/.github/workflows/release.yml', '/devenv.nix', '/devenv.lock']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
