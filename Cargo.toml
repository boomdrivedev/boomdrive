# flywheel-runner's crates: flywheel, its library and binary; and
# flywheel-control, the interface the runner reaches its control plane
# through (design Decision 1). Each is a moon project of its own (core.7).
[workspace]
resolver = "2"
members = ["crates/flywheel", "crates/flywheel-control"]

[workspace.package]
version = "0.0.0"
edition = "2021"

[workspace.dependencies]
# The command line (design 10).
clap = { version = "4", features = ["derive"] }
# The configuration, read from TOML (design 2).
serde = { version = "1", features = ["derive"] }
toml = "1"
# The control plane's times, RFC 3339 in UTC to the second (design
# Decision 2).
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
# The runner's report as JSON (design Decision 2), and Flume's answers
# read as JSON, the host part's fields sliced as Flume printed them
# (design Decision 6).
serde_json = { version = "1", features = ["raw_value"] }
# SIGTERM and SIGINT, which stop the runner between repositories
# (design 10).
signal-hook = "0.3"
# The tests: a scratch host in a temporary directory, and a signal sent to
# the runner (design 11, 10).
tempfile = "3"
libc = "0.2"
