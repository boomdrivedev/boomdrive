# flywheel-runner's crates: flywheel, its library and binary;
# flywheel-control, the interface the runner reaches its control plane
# through; flywheel-crew, crew's implementation of it (design Decision 1);
# and flywheel-hosted, the hosted control plane's, which holds the runner's
# protocol (core.42). Each is a moon project of its own (core.7).
[workspace]
resolver = "2"
members = [
  "crates/flywheel",
  "crates/flywheel-control",
  "crates/flywheel-crew",
  "crates/flywheel-hosted",
]

[workspace.package]
version = "0.0.0"
edition = "2021"

[workspace.dependencies]
# The command line (design 10).
clap = { version = "4", features = ["derive"] }
# The configuration, read from TOML (design 2).
serde = { version = "1", features = ["derive"] }
toml = "1"
# The control plane's times, RFC 3339 in UTC to the second (design
# Decision 2).
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
# The runner's report as JSON (design Decision 2), and Flume's answers
# read as JSON, the host part's fields sliced as Flume printed them
# (design Decision 6).
serde_json = { version = "1", features = ["raw_value"] }
# The inbox's layout and records, read by weir's crate at the revision of
# weir's main that flume pins, moved by a chore when weir changes (design
# Decision 14). weir-capture's capture is what a test takes into an inbox
# by weir's own write (Task notes 5.2), and crew's records are read and
# written by its recutils reader and writer. weir-branch reads crew's state
# repository at one tip and writes the runner's branch by weir's write
# (design Decision 17).
weir-signals = { git = "https://github.com/agentplot/weir", rev = "0b6eb5abb806a51fec128b01f97c4dcff6170219" }
weir-capture = { git = "https://github.com/agentplot/weir", rev = "0b6eb5abb806a51fec128b01f97c4dcff6170219" }
weir-branch = { git = "https://github.com/agentplot/weir", rev = "0b6eb5abb806a51fec128b01f97c4dcff6170219" }
# The digest an inbox item's brief is carried by (design Decision 14).
sha2 = "0.10"
# SIGTERM and SIGINT, which stop the runner between repositories
# (design 10).
signal-hook = "0.3"
# The tests: a scratch host in a temporary directory, and a signal sent to
# the runner (design 11, 10).
tempfile = "3"
libc = "0.2"
# Each message checked against its version's JSON Schema, by the hosted
# implementation and the protocol's tests, with no default features, so
# that no reference is fetched over the network or from a file (core.42).
jsonschema = { version = "0.60", default-features = false }
# The hosted implementation (design Decisions 2 to 5): the table's `url`
# parsed as WHATWG has it; each partition's Ed25519 key, zeroized on drop,
# made from the operating system's randomness, its bytes and signatures in
# base64url; each message's id a UUID of version 7; and the host's name,
# which an enrolment carries.
url = "2"
ed25519-dalek = "2"
getrandom = "0.3"
zeroize = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v7"] }
gethostname = "1"
# The enrolment's one request, over rustls, its certificate verified
# against the host's own roots (design Decision 4; record 0008). It serves
# nothing (core.3).
ureq = { version = "3", default-features = false, features = [
  "rustls",
  "platform-verifier",
] }
# The host's key in the macOS keychain, by keyring v4's macOS store, and
# keyring's mock store, which a test keeps it in (design Decisions 3 and
# 14; core.32).
keyring-core = "1"
apple-native-keyring-store = { version = "1", features = ["keychain"] }
# The fake hosted control plane, test code alone, on the loopback address
# (design Decision 14).
tokio = { version = "1", features = [
  "rt-multi-thread",
  "net",
  "io-util",
  "time",
  "sync",
  "macros",
] }
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", default-features = false, features = [
  "sink",
  "std",
] }
