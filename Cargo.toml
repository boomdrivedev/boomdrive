# boomdrive's crates: boomdrive, its library and binary;
# boomdrive-control, the interface the runner reaches its control plane
# through; boomdrive-crew, crew's implementation of it (design Decision 1);
# and boomdrive-hosted, the hosted control plane's, which holds the
# runner's protocol (core.42). Each is a moon project of its own (core.7).
[workspace]
resolver = "2"
members = [
  "crates/boomdrive",
  "crates/boomdrive-control",
  "crates/boomdrive-crew",
  "crates/boomdrive-hosted",
]

[workspace.package]
version = "0.9.2"
edition = "2021"

[workspace.dependencies]
# The command line (design 10).
clap = { version = "4", features = ["derive"] }
# The configuration, read from TOML (design 2).
serde = { version = "1", features = ["derive"] }
toml = "1"
# The control plane's times, RFC 3339 in UTC to the second (design
# Decision 2).
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
# The runner's report as JSON (design Decision 2), and Flume's answers
# read as JSON, the host part's fields sliced as Flume printed them
# (design Decision 6).
serde_json = { version = "1", features = ["raw_value"] }
# The inbox's layout and records, read by weir's crate at one revision of
# weir's main, the four moved together by a chore when weir changes
# (design Decision 14). weir-capture's capture is what a test takes into an
# inbox by weir's own write (Task notes 5.2), and crew's records are read
# and written by its recutils reader and writer. weir-branch reads crew's
# state repository at one tip and writes the runner's branch by weir's
# write (design Decision 17), each try of its fetch, listing and push run
# to weir-bounded's limit. weir-bounded runs each of the runner's own git
# calls to a remote to the family's limit, in a process group of its own
# (weir record 0008; record 0042 as amended on 2026-11-11; core.58). The
# revision is 9cba691 or later, the first that holds weir-bounded.
weir-signals = { git = "https://github.com/boomdrivedev/weir", rev = "9cba69196e9269a36b02024861340355bdbe6d4b" }
weir-capture = { git = "https://github.com/boomdrivedev/weir", rev = "9cba69196e9269a36b02024861340355bdbe6d4b" }
weir-branch = { git = "https://github.com/boomdrivedev/weir", rev = "9cba69196e9269a36b02024861340355bdbe6d4b" }
weir-bounded = { git = "https://github.com/boomdrivedev/weir", rev = "9cba69196e9269a36b02024861340355bdbe6d4b" }
# The digest an inbox item's brief is carried by (design Decision 14).
sha2 = "0.10"
# SIGTERM and SIGINT, which stop the runner between repositories
# (design 10).
signal-hook = "0.3"
# The tests: a scratch host in a temporary directory, and a signal sent to
# the runner (design 11, 10); and SIGINT sent to sluice's ask of a
# preview at the runner's patience (core.55).
tempfile = "3"
libc = "0.2"
# Each message checked against its version's JSON Schema, by the hosted
# implementation and the protocol's tests, with no default features, so
# that no reference is fetched over the network or from a file (core.42).
jsonschema = { version = "0.60", default-features = false }
# The hosted implementation (design Decisions 2 to 5): the table's `url`
# parsed as WHATWG has it; each partition's Ed25519 key, zeroized on drop,
# made from the operating system's randomness, its bytes and signatures in
# base64url; each message's id a UUID of version 7; and the host's name,
# which an enrollment carries.
url = "2"
ed25519-dalek = "2"
getrandom = "0.3"
zeroize = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v7"] }
gethostname = "1"
# The enrollment's one request, over rustls, its certificate verified
# against the host's own roots (design Decision 4; record 0008). It serves
# nothing (core.3).
ureq = { version = "3", default-features = false, features = [
  "rustls",
  "platform-verifier",
] }
# A mint's JWT, signed with the Boomdrive App's key, RS256, as sluice signs
# one (record 0007 as amended on 2026-11-11).
jsonwebtoken = "9"
# The tests' key for the App, made at run time from the system's randomness
# and written as PEM, since no key is committed (core.4).
rsa = { version = "0.9", features = ["getrandom", "pem"] }
# The host's key in the macOS keychain, by keyring v4's macOS store, and
# keyring's mock store, which a test keeps it in (design Decisions 3 and
# 14; core.32).
keyring-core = "1"
apple-native-keyring-store = { version = "1", features = ["keychain"] }
# Each partition's one outgoing socket, on the hosted implementation's
# runtime of its own, over rustls with the host's own roots (design
# Decisions 1 and 6; record 0008), and the fake hosted control plane, test
# code alone, on the loopback address (design Decision 14). Neither
# serves HTTP or WebSockets in the runner's sources (core.3).
tokio = { version = "1", features = [
  "rt-multi-thread",
  "net",
  "io-util",
  "time",
  "sync",
  "macros",
] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
futures-util = { version = "0.3", default-features = false, features = [
  "sink",
  "std",
] }
# `boomdrive enroll`'s one-time token, read without echo where standard
# input is a terminal (design Decision 4; core.4).
rpassword = "7"

# The tests' key for the App, made at run time, in well under a second
# with its arithmetic optimized (record 0007 as amended on 2026-11-11).
[profile.dev.package.num-bigint-dig]
opt-level = 3
