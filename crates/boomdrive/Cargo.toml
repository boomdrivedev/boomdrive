[package]
name = "boomdrive"
version.workspace = true
edition.workspace = true
description = "The runner on each host: keeps the clones its configuration names and carries the control plane's work into flume launches."
publish = false

[[bin]]
name = "boomdrive"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[features]
# The stand-in for Claude Code that the quick start's last step's test
# runs, built only for the runner's tests (design Decision 6 of the change
# boomdrives-quick-start-takes-a-stranger-to-a-working-drive).
stand-in = []

# The stand-in for Claude Code, run as `claude` by Flume's printed command
# in tests/quick_start.rs, as Flume's flume-stand-in is run; no release
# builds it, since the flake's package names no feature.
[[bin]]
name = "boomdrive-stand-in"
path = "tests/stand-in/claude.rs"
test = false
required-features = ["stand-in"]

[dependencies]
clap.workspace = true
# The one interface the runner reaches its control plane through (design
# Decision 1; core.2).
boomdrive-control = { path = "../boomdrive-control" }
# crew's implementation of it, and the hosted control plane's, which only
# the list of implementations, src/planes.rs, names (design Decisions 1
# and 4; core.2).
boomdrive-crew = { path = "../boomdrive-crew" }
boomdrive-hosted = { path = "../boomdrive-hosted" }
# `boomdrive enroll`'s token, read without echo where standard input is a
# terminal (design Decision 4).
rpassword.workspace = true
# SIGINT sent to sluice's ask of a preview at the runner's patience,
# which ends sluice's wait at the host's bound and nothing else (design
# Decision 3; core.55).
libc.workspace = true
serde.workspace = true
# A mint's JWT, signed with the Boomdrive App's key, RS256 (record 0007 as
# amended on 2026-11-11; design Decision 2).
jsonwebtoken.workspace = true
# A mint's two calls to GitHub's API, over rustls with the host's own
# roots, each stopped at its limit (design Decision 2; core.28).
ureq.workspace = true
# A token's end, GitHub's `expires_at` read as RFC 3339 (design Decision
# 2).
time.workspace = true
# Each owner's VS Code workspace is read and written with its members in
# their order (design Decision 4).
serde_json = { workspace = true, features = ["preserve_order"] }
sha2.workspace = true
signal-hook.workspace = true
toml.workspace = true
weir-signals.workspace = true
# A clone's fetch run to the family's limit, in a process group of its own,
# by weir's crate (weir record 0008; record 0042 as amended on 2026-11-11;
# core.58).
weir-bounded.workspace = true

[dev-dependencies]
# The tests' key for the App, made at run time, since no key is committed
# (core.4; design Decision 9).
rsa.workspace = true
tempfile.workspace = true
weir-capture.workspace = true
