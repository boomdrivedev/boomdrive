$schema: 'https://moonrepo.dev/schemas/project.json'

# The hosted control plane's implementation, flywheel-hosted, which holds
# the runner's protocol. Each check is one task, in the fast layer
# (core.7). Each builds flywheel-control too, so takes its sources. Its
# tests cut Flume's and sluice's answers kept as the binary's fixtures, so
# its test task takes them too.
language: 'rust'
layer: 'library'

tasks:
  format:
    command: 'cargo fmt --check -p flywheel-hosted'
    inputs: ['/crates/flywheel-hosted/**/*', '/crates/flywheel-control/**/*', '/Cargo.toml', '/Cargo.lock', '/devenv.nix', '/devenv.lock', '/.prototools', '/rust-toolchain.toml']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  lint:
    command: 'cargo clippy -p flywheel-hosted --all-targets --all-features -- -D warnings'
    inputs: ['/crates/flywheel-hosted/**/*', '/crates/flywheel-control/**/*', '/Cargo.toml', '/Cargo.lock', '/devenv.nix', '/devenv.lock', '/.prototools', '/rust-toolchain.toml']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  typecheck:
    command: 'cargo check -p flywheel-hosted --all-targets --all-features'
    inputs: ['/crates/flywheel-hosted/**/*', '/crates/flywheel-control/**/*', '/Cargo.toml', '/Cargo.lock', '/devenv.nix', '/devenv.lock', '/.prototools', '/rust-toolchain.toml']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  test:
    command: 'cargo test -p flywheel-hosted'
    inputs: ['/crates/flywheel-hosted/**/*', '/crates/flywheel-control/**/*', '/crates/flywheel/tests/fixtures/**/*', '/Cargo.toml', '/Cargo.lock', '/devenv.nix', '/devenv.lock', '/.prototools', '/rust-toolchain.toml']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
