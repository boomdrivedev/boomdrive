$schema: 'https://moonrepo.dev/schemas/project.json'

# The control-plane interface, flywheel-control. Each check is one task,
# in the fast layer (core.7).
language: 'rust'
layer: 'library'

tasks:
  format:
    command: 'cargo fmt --check -p flywheel-control'
    inputs: ['/crates/flywheel-control/**/*', '/Cargo.toml', '/Cargo.lock', '/devenv.nix', '/devenv.lock', '/.prototools', '/rust-toolchain.toml']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  lint:
    command: 'cargo clippy -p flywheel-control --all-targets --all-features -- -D warnings'
    inputs: ['/crates/flywheel-control/**/*', '/Cargo.toml', '/Cargo.lock', '/devenv.nix', '/devenv.lock', '/.prototools', '/rust-toolchain.toml']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  typecheck:
    command: 'cargo check -p flywheel-control --all-targets --all-features'
    inputs: ['/crates/flywheel-control/**/*', '/Cargo.toml', '/Cargo.lock', '/devenv.nix', '/devenv.lock', '/.prototools', '/rust-toolchain.toml']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  test:
    command: 'cargo test -p flywheel-control'
    inputs: ['/crates/flywheel-control/**/*', '/Cargo.toml', '/Cargo.lock', '/devenv.nix', '/devenv.lock', '/.prototools', '/rust-toolchain.toml']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
