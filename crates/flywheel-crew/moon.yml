$schema: 'https://moonrepo.dev/schemas/project.json'

# crew's implementation of the control-plane interface, flywheel-crew.
# Each check is one task, in the fast layer (core.7). Each builds
# flywheel-control too, so takes its sources; and the tests carry Flume's
# own answers from flywheel's fixtures, so all but format take those.
language: 'rust'
layer: 'library'

tasks:
  format:
    command: 'cargo fmt --check -p flywheel-crew'
    inputs: ['/crates/flywheel-crew/**/*', '/crates/flywheel-control/**/*', '/Cargo.toml', '/Cargo.lock', '/devenv.nix', '/devenv.lock', '/.prototools', '/rust-toolchain.toml']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  lint:
    command: 'cargo clippy -p flywheel-crew --all-targets --all-features -- -D warnings'
    inputs: ['/crates/flywheel-crew/**/*', '/crates/flywheel-control/**/*', '/crates/flywheel/tests/fixtures/**/*', '/Cargo.toml', '/Cargo.lock', '/devenv.nix', '/devenv.lock', '/.prototools', '/rust-toolchain.toml']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  typecheck:
    command: 'cargo check -p flywheel-crew --all-targets --all-features'
    inputs: ['/crates/flywheel-crew/**/*', '/crates/flywheel-control/**/*', '/crates/flywheel/tests/fixtures/**/*', '/Cargo.toml', '/Cargo.lock', '/devenv.nix', '/devenv.lock', '/.prototools', '/rust-toolchain.toml']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  test:
    command: 'cargo test -p flywheel-crew'
    inputs: ['/crates/flywheel-crew/**/*', '/crates/flywheel-control/**/*', '/crates/flywheel/tests/fixtures/**/*', '/Cargo.toml', '/Cargo.lock', '/devenv.nix', '/devenv.lock', '/.prototools', '/rust-toolchain.toml']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
