$schema: 'https://moonrepo.dev/schemas/project.json'

# A call to a remote run to its limit, boomdrive-bounded (record 0042).
# Each check is one task, in the fast layer (core.7).
language: 'rust'
layer: 'library'

tasks:
  format:
    command: 'cargo fmt --check -p boomdrive-bounded'
    inputs: ['/crates/boomdrive-bounded/**/*', '/Cargo.toml', '/Cargo.lock', '/devenv.nix', '/devenv.lock', '/.prototools', '/rust-toolchain.toml']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  lint:
    command: 'cargo clippy -p boomdrive-bounded --all-targets --all-features -- -D warnings'
    inputs: ['/crates/boomdrive-bounded/**/*', '/Cargo.toml', '/Cargo.lock', '/devenv.nix', '/devenv.lock', '/.prototools', '/rust-toolchain.toml']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  typecheck:
    command: 'cargo check -p boomdrive-bounded --all-targets --all-features'
    inputs: ['/crates/boomdrive-bounded/**/*', '/Cargo.toml', '/Cargo.lock', '/devenv.nix', '/devenv.lock', '/.prototools', '/rust-toolchain.toml']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  test:
    command: 'cargo test -p boomdrive-bounded'
    inputs: ['/crates/boomdrive-bounded/**/*', '/Cargo.toml', '/Cargo.lock', '/devenv.nix', '/devenv.lock', '/.prototools', '/rust-toolchain.toml']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
