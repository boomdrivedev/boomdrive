[package]
name = "flywheel"
version.workspace = true
edition.workspace = true
description = "The runner on each host: keeps the clones its configuration names and carries the control plane's work into flume launches."
publish = false

[[bin]]
name = "flywheel"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
clap.workspace = true
# The one interface the runner reaches its control plane through (design
# Decision 1; core.2).
flywheel-control = { path = "../flywheel-control" }
serde.workspace = true
serde_json.workspace = true
signal-hook.workspace = true
toml.workspace = true

[dev-dependencies]
tempfile.workspace = true
libc.workspace = true
