# sluice gates every merge onto main and into a bolt: the checks moon
# tags, in boomdrive's devenv shell, main on GitHub as the sluice app lands
# it. A bolt is made on GitHub with `sluice branch create` and lands into
# main by sluice, through main's gate. The layers are .moon/workspace.yml's.
[tests]
runner = "moon"
toolchain = ["devenv", "print-dev-env"]
# Stops the site a preview served in a place (`sluice exec <branch> --
# site-serve`, the content kind's preview); where nothing was served, as
# after every candidate's checks, it does nothing and succeeds.
release = "site-stop"

# SLUICE_PORT_WEB, held for each checkout and worktree: the port
# site-serve serves the place's own site on, so no two places share one.
[checkout]
ports = ["web"]

[executor]
kind = "sandbox"
# Nothing the checks run reaches past the host.
network = "localhost"

# A bolt is held to main's bar: its replay counts only when a sandboxed or
# confined run recorded a pass for its key, since the cache also holds what
# open shells ran.
[branches."bolt/*"]
required = ["#check-fast"]
trust = ["confined", "sandbox"]
parallel = 2
batch = false
flaky = "fail"
timeout = "10m"
remote = "origin"

# A replay counts on main only when a sandboxed or confined run recorded a
# pass for its key: the cache also holds what open shells ran.
[branches.main]
required = ["#check-fast"]
trust = ["confined", "sandbox"]
parallel = 2
batch = false
flaky = "fail"
timeout = "10m"
remote = "origin"

[branches.main.pull_requests]
reviews = 0
