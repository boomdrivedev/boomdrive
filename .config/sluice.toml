# sluice gates every merge onto main and into a bolt: the checks moon
# tags, in boomdrive's devenv shell, main on GitHub as the sluice app lands
# it. A bolt is made on GitHub with `sluice branch create` and lands into
# main by sluice, through main's gate. The layers are .moon/workspace.yml's.
[tests]
runner = "moon"
toolchain = ["devenv", "print-dev-env"]
# Stops the site a preview served in a place (`sluice exec <branch> --
# site-serve`, the content kind's preview); where nothing was served, as
# after every candidate's checks, it does nothing and succeeds.
release = "site-stop"

# SLUICE_PORT_WEB, held for each checkout and worktree: the port
# site-serve serves the place's own site on, so no two places share one.
[checkout]
ports = ["web"]

[executor]
kind = "sandbox"
# The checks may reach past the host: boomdrive-hosted:cloud-protocol reads
# boomdrive-cloud's main as GitHub holds it, so a change that would leave
# the runner and the cloud no protocol version in common is refused at
# the merge (record 0056, point 5; core.42). Every other check reaches
# nothing past the host but what it starts there.
network = true

# The one signer whose runs the gates count: deneb, where the sessions run
# and submit, signing as sessions with its own key, as sluice's own policy
# names it. A branch that takes pull requests names its signers (sluice
# record 0125, D22).
[signers.sessions]
ssh = "deneb ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHGx/Ip3yodP/Rg3DdMAjJXoYuBmMxTLpPrka3ei69M/ sluice deneb"

# A bolt is held to main's bar: its replay counts only when a run deneb
# signed recorded a pass for its key, since the cache also holds what open
# shells ran.
[branches."bolt/*"]
required = ["#check-fast"]
trust = ["sessions"]
parallel = 2
batch = false
flaky = "fail"
timeout = "10m"
remote = "origin"

# A replay counts on main only when a run deneb signed recorded a pass for
# its key: the cache also holds what open shells ran.
[branches.main]
required = ["#check-fast"]
trust = ["sessions"]
parallel = 2
batch = false
flaky = "fail"
timeout = "10m"
remote = "origin"

[branches.main.pull_requests]
reviews = 0
