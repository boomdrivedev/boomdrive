# git-cliff: the next version and its notes, from the Conventional
# Commits since the newest v* tag (record 0024, core.48). The workflow
# release asks it through release.sh at each push to main, and tags a
# release commit, cut from the commit of main that was pushed, which
# writes the version into the tree; main names 0.0.0. The newest tag
# names a release commit off main's history, which git-cliff's walk of
# the history never reaches, so only --unreleased starts the range at it,
# as release.sh and release-preview ask. `devenv shell -- release-preview`
# shows what it would release. sluice's, with boomdrive's links.

[changelog]
header = ""
body = """
{% if version %}\
## {{ version }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}\
{{ commit.message | split(pat="\n") | first | trim | upper_first }} \
([{{ commit.id | truncate(length=7, end="") }}](https://github.com/boomdrivedev/boomdrive/commit/{{ commit.id }}))\
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true
postprocessors = [
  { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/boomdrivedev/boomdrive/issues/${1}))" },
]

[git]
conventional_commits = true
# A commit that is not conventional, a `Revert "..."` git revert wrote or
# a merge whose subject git wrote, is in no release's notes and bumps no
# version. root:commits holds every other commit to the convention
# (check-commits.sh).
filter_unconventional = true
# A commit that changes only the site, site/ and its workflow pages, is in
# no release's notes and bumps no version, the runner's releases seeing
# none of the site's commits; one that changes the site and anything else
# is read as any commit (core.48, record 0038).
exclude_paths = ["site/**", ".github/workflows/pages.yml"]
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
topo_order = false
sort_commits = "oldest"
commit_preprocessors = [{ pattern = '(?m)^Co-Authored-By:.*$', replace = "" }]
# The HTML comments order the groups; the body strips them.
commit_parsers = [
  { message = "^[a-z]+(\\(.+\\))?!:", group = "<!-- 0 -->Breaking changes" },
  { body = "BREAKING[ -]CHANGE", group = "<!-- 0 -->Breaking changes" },
  { message = "^feat", group = "<!-- 1 -->Features" },
  { message = "^fix", group = "<!-- 2 -->Fixes" },
  { message = "^perf", group = "<!-- 3 -->Performance" },
  { message = "^refactor", group = "<!-- 4 -->Refactors" },
  { message = "^docs", group = "<!-- 5 -->Documentation" },
  { message = "^chore", skip = true },
  { message = ".*", skip = true },
]

[bump]
features_always_bump_minor = true
breaking_always_bump_major = false
initial_tag = "v0.1.0"
